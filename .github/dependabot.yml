# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      include: "scope"
      prefix: "github-actions"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "uv"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      include: "scope"
      prefix: "docs-deps"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
